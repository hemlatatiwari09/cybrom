
<!DOCTYPE html>
<html>
<head>
    <title>Birthday Card</title>

    <style>
        body {
            background: #ffe4ec;
            text-align: center;
            font-family: Arial;
            padding-top: 100px;
        }

        .card {
            background: white;
            width: 350px;
            margin: auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 20px #aaa;
        }

        h1 {
            color: #e91e63;
            font-size: 40px;
        }

        p {
            font-size: 18px;
        }

        button {
            background: #e91e63;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 20px;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>🎂 Happy Birthday! 🎉</h1>

        <h2>Dear Friend ❤️</h2>

        <p>
            Wishing you lots of happiness,
            success and beautiful memories.
        </p>

        <p>✨ Have an Amazing Day! ✨</p>

        <button>Celebrate 🎈</button>
    </div>

</body>
</html>
