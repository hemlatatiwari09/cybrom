
<!DOCTYPE html>
<html>
<head>
    <title>Student Profile</title>

    <style>
        body {
            font-family: Arial;
            background-color: #eaf4ff;
            text-align: center;
        }

        .profile {
            width: 350px;
            margin: 60px auto;
            padding: 25px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px #aaa;
        }

        h1 {
            color: #2563eb;
        }

        h2 {
            color: #444;
        }

        p {
            font-size: 17px;
        }

        .skills {
            color: #2563eb;
            font-weight: bold;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="profile">

        <h1>👩‍🎓 Student Profile</h1>

        <h2>Hemlata Tiwari</h2>

        <p><b>Course:</b> B.Tech Computer Science</p>

        <p><b>Semester:</b> 5th Semester</p>

        <p><b>College:</b> ABC College</p>

        <p><b>Email:</b> student@example.com</p>

        <p><b>Skills:</b></p>

        <p class="skills">
            HTML | CSS | Java 
        </p>

        <button>View Profile</button>

    </div>

</body>
</html>
